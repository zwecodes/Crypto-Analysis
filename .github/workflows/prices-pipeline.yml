name: Prices Pipeline

on:
  schedule:
    - cron: "5 * * * *"   # every hour, 5 minutes past, so the previous candle has closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Load latest BTC candles into Supabase
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python services/data_pipeline.py