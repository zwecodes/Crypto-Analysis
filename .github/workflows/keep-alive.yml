name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="https://crypto-analysis-backend.onrender.com/health"
          for i in 1 2 3 4 5 6; do
            echo "Ping attempt $i at $(date -u)"
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 90 "$URL" || true)
            echo "HTTP $code"
            if [ -f /tmp/health.json ]; then
              cat /tmp/health.json
              echo
            fi
            if [ "$code" = "200" ]; then
              echo "Backend is awake"
              exit 0
            fi
            echo "Not ready yet, waiting 20s..."
            sleep 20
          done
          echo "Backend did not return 200 after retries"
          exit 1
