name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="https://crypto-analysis-x1y8.onrender.com/health"
          for i in 1 2 3 4 5 6; do
            echo "Ping attempt $i at $(date)"
            if curl -sf --max-time 90 "$URL"; then
              echo "Backend is awake."
              exit 0
            fi
            echo "Not ready yet, waiting 20s..."
            sleep 20
          done
          echo "Backend did not return 200 after retries"
          exit 1