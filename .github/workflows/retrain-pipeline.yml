name: Retraining Pipeline

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  retrain-pipeline:
    runs-on: ubuntu-latest
    env:
      BINANCE_BASE_URL: https://data-api.binance.vision
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Pull data, retrain and evaluate
        run: python -m train

      - name: Show model files
        run: ls -l models && cat models/metrics.json

      - name: Compare with current model (none stored yet)
        id: compare
        run: python compare_models.py --candidate-dir models --current-dir current_model --margin 0.02 --title "Candidate vs current model"

      - name: TEST - candidate against a copy of itself
        run: |
          cp -r models current_model_test
          python compare_models.py --candidate-dir models --current-dir current_model_test --margin 0.02 --title "TEST margin 0.02 (expect keep)"
          python compare_models.py --candidate-dir models --current-dir current_model_test --margin -1 --title "TEST margin -1 (expect promote)"

      - name: Upload candidate model
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          path: |
            ml/models/baseline_xgb.pkl
            ml/models/label_map.pkl
            ml/models/metrics.json
          if-no-files-found: error

      - name: Log result
        run: echo "Retraining pipeline ran successfully at $(date -u)"