name: Retraining Pipeline

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  retrain-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Pull data, retrain and evaluate
        env:
          BINANCE_BASE_URL: https://data-api.binance.vision
        run: python -m train

      - name: Upload candidate model
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          path: ml/models/baseline_rf.pkl
          if-no-files-found: error

      - name: Log result
        run: echo "Retraining pipeline ran successfully at $(date -u)"