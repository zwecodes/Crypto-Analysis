name: Alert job

on:
  schedule:
    - cron: "10 * * * *"   # every hour at minute 10
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no emails). Type false to send real emails."
        default: "true"
      test_email:
        description: "Send ONE test email to the EMAIL_USER address and stop. Type true to test."
        default: "false"
      test_alert:
        description: "Send a labeled TEST alert to every active user (needs dry_run=false). Type true to test."
        default: "false"

permissions:
  contents: read

concurrency:
  group: alert-job
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r ml/requirements.txt
          pip install supabase==2.31.0 websockets==15.0.1 python-dotenv

      - name: Download production model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ml/models
          gh release download production-model --repo "${{ github.repository }}" --dir ml/models --clobber
          ls ml/models

      - name: Write latest ML signal
        working-directory: ml
        env:
          BINANCE_BASE_URL: https://data-api.binance.vision
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python update_signals.py

      - name: Run alerts
        env:
          BINANCE_BASE_URL: https://data-api.binance.vision
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TEST_EMAIL: ${{ github.event.inputs.test_email || 'false' }}
          TEST_ALERT: ${{ github.event.inputs.test_alert || 'false' }}
        run: python alerts/run_alerts.py